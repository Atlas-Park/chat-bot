<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="대화의 흐름을 기억하는 AI 챗봇" />
    <meta name="theme-color" content="#f3f0e8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Moyo — AI Chat</title>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Moyo 홈">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>Moyo</span>
        </a>
        <div class="status"><span aria-hidden="true"></span> gpt-4o-mini</div>
        <button class="clear-button" id="clearButton" type="button" title="새 대화 시작">
          새 대화
        </button>
      </header>

      <main class="chat" id="chat" aria-live="polite">
        <section class="welcome" id="welcome">
          <p class="eyebrow">YOUR THOUGHT PARTNER</p>
          <h1>무엇을 함께<br />생각해 볼까요?</h1>
          <p class="welcome-copy">대화의 흐름을 기억하며 답해 드려요.</p>
          <div class="suggestions" aria-label="추천 질문">
            <button type="button">오늘 할 일을 우선순위로 정리해 줘</button>
            <button type="button">새로운 프로젝트 아이디어를 같이 고민해 줘</button>
            <button type="button">복잡한 개념을 쉽게 설명해 줘</button>
          </div>
        </section>
        <div class="messages" id="messages"></div>
      </main>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <label class="sr-only" for="messageInput">메시지 입력</label>
          <textarea id="messageInput" rows="1" maxlength="8000" placeholder="메시지를 입력하세요" required></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="메시지 보내기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14" /></svg>
          </button>
        </form>
        <p class="notice">AI는 실수할 수 있어요. 중요한 정보는 한 번 더 확인해 주세요.</p>
      </footer>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
